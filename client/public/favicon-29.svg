<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f2744"/>
  <!-- Open compass / guide -->
  <circle cx="16" cy="15" r="9" fill="none" stroke="#60a5fa" stroke-width="1.3"/>
  <!-- Compass needle north (yellow) -->
  <polygon points="16,6 14.5,15 17.5,15" fill="#facc15"/>
  <!-- Compass needle south (blue) -->
  <polygon points="16,24 14.5,15 17.5,15" fill="#60a5fa" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="16" cy="15" r="1.8" fill="white"/>
  <!-- Cardinal letters -->
  <text x="15" y="5"  font-size="3.2" fill="#facc15" font-family="Arial" font-weight="bold" text-anchor="middle">N</text>
  <text x="27" y="16" font-size="3.2" fill="#60a5fa" font-family="Arial" text-anchor="middle" opacity="0.8">L</text>
  <text x="5"  y="16" font-size="3.2" fill="#60a5fa" font-family="Arial" text-anchor="middle" opacity="0.8">O</text>
  <!-- Small star at top-right -->
  <polygon points="26,5 26.8,7.4 29.4,7.4 27.3,8.9 28.1,11.3 26,9.8 23.9,11.3 24.7,8.9 22.6,7.4 25.2,7.4" fill="#facc15" opacity="0.85" transform="scale(0.55) translate(22,0)"/>
</svg>
