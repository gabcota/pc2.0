<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f2744"/>
  <!-- Graduation cap base -->
  <polygon points="16,7 27,12 16,17 5,12" fill="#facc15"/>
  <!-- Cap top square -->
  <rect x="13" y="6.5" width="6" height="2" rx="1" fill="#facc15"/>
  <!-- Diploma scroll body -->
  <rect x="10" y="19" width="12" height="8" rx="2" fill="#1e3f6f" stroke="#60a5fa" stroke-width="1.1"/>
  <!-- Scroll ribbon -->
  <line x1="10" y1="22" x2="22" y2="22" stroke="#60a5fa" stroke-width="0.9" opacity="0.7"/>
  <!-- Tassel string -->
  <line x1="24" y1="12" x2="24" y2="19" stroke="#facc15" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="20" r="1.5" fill="#facc15"/>
</svg>
