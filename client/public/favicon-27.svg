<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f2744"/>
  <!-- Crosshair / target outer ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#60a5fa" stroke-width="1.4"/>
  <!-- Middle ring -->
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <!-- Bullseye -->
  <circle cx="16" cy="16" r="3" fill="#facc15"/>
  <!-- Cross hairs -->
  <line x1="16" y1="5"  x2="16" y2="10.5" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="21.5" x2="16" y2="27" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="5"  y1="16" x2="10.5" y2="16" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="21.5" y1="16" x2="27" y2="16" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
</svg>
