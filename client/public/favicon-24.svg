<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f2744"/>
  <!-- Clipboard board -->
  <rect x="7" y="9" width="18" height="17" rx="2" fill="#1e3f6f" stroke="#60a5fa" stroke-width="1.1"/>
  <!-- Clipboard top clip -->
  <rect x="12" y="7" width="8" height="4" rx="2" fill="#60a5fa"/>
  <!-- Checklist lines -->
  <line x1="13" y1="16" x2="21" y2="16" stroke="#facc15" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13" y1="19.5" x2="21" y2="19.5" stroke="#facc15" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="13" y1="23" x2="19" y2="23" stroke="#facc15" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Check marks -->
  <polyline points="9.5,16 10.8,17.3 12.5,14.5" fill="none" stroke="#4ade80" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="9.5,19.5 10.8,20.8 12.5,18" fill="none" stroke="#4ade80" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
