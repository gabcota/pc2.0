<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f2744"/>
  <!-- Pencil body -->
  <rect x="13" y="5" width="6" height="17" rx="1" fill="#1e3f6f" stroke="#60a5fa" stroke-width="1"/>
  <!-- Pencil tip -->
  <polygon points="13,22 19,22 16,28" fill="#facc15"/>
  <!-- Pencil eraser top -->
  <rect x="13" y="5" width="6" height="3.5" rx="1" fill="#f87171"/>
  <!-- Eraser band -->
  <line x1="13" y1="8.5" x2="19" y2="8.5" stroke="#60a5fa" stroke-width="0.8"/>
  <!-- Pencil line details -->
  <line x1="14.5" y1="10" x2="17.5" y2="10" stroke="#60a5fa" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
  <line x1="14.5" y1="12.5" x2="17.5" y2="12.5" stroke="#60a5fa" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
  <!-- Small star top-right -->
  <polygon points="26,5 27,7.5 29.5,7.5 27.5,9 28.3,11.5 26,10 23.7,11.5 24.5,9 22.5,7.5 25,7.5" fill="#facc15" opacity="0.9" transform="scale(0.6) translate(17,-1)"/>
</svg>
